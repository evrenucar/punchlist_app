<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punchlist review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%23191b1a' transform='rotate(-4 12 12)'/%3E%3Cpath d='M7 13l3.4 3.4L17.5 8' stroke='white' stroke-width='2.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='20' cy='4.5' r='3' fill='%23ef4444'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f2; --surface: #ffffff; --text: #202422; --muted: #65716b;
    --line: #d8ded8; --accent: #246bfe; --done: #2d7d46; --warn: #bd6f23;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151716; --surface: #202321; --text: #f1f4ef; --muted: #a8b2aa; --line: #3a403c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px 16px 72px;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; letter-spacing: -0.01em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  .progress { font-size: 13px; font-weight: 700; color: var(--accent); margin: 0 0 10px; }
  h2 { font-size: 13px; margin: 26px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
  /* Evren, 2026-07-28: "have step by step questionnaires". One question on
     screen at a time, so a long round reads as a few seconds of work instead
     of a wall of cards. The bar is the only thing that says how much is left. */
  .bar { height: 4px; border-radius: 999px; background: var(--line); margin: 0 0 8px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: var(--accent); transition: width 220ms ease; }
  .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  .navbar { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button.nav {
    font: inherit; font-size: 13.5px; font-weight: 700; padding: 8px 16px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    color: var(--text); cursor: pointer;
  }
  button.nav:disabled { opacity: 0.4; cursor: default; }
  button.nav.next { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hint { font-size: 12px; color: var(--muted); }
  .review { list-style: none; padding: 0; margin: 0; }
  .review li {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 13px; margin: 6px 0; font-size: 13.5px;
  }
  .review li b { display: block; font-size: 12.5px; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .review li.skipped { border-style: dashed; color: var(--muted); }
  .review button.jump {
    font: inherit; font-size: 12px; margin-top: 7px; padding: 3px 10px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--bg);
    color: var(--muted); cursor: pointer;
  }
  .review button.jump:hover { border-color: var(--accent); color: var(--accent); }
  .item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; margin: 8px 0;
  }
  .item.noted { border-color: var(--accent); }
  .shots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .shot { position: relative; display: block; line-height: 0; }
  .shot img {
    max-width: 190px; max-height: 140px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg);
  }
  .shot-drop {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    border: 1px solid var(--line); border-radius: 50%; background: var(--surface);
    color: var(--muted); font: 700 13px/1 system-ui; cursor: pointer;
  }
  .shot-drop:hover { color: var(--warn); }
  .item h3 { font-size: 15px; margin: 0 0 3px; }
  .item p { margin: 0 0 8px; color: var(--muted); font-size: 13.5px; white-space: pre-line; }
  .answers { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 9px; }
  .chip {
    font: inherit; font-size: 12.5px; line-height: 1.3; padding: 5px 11px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--bg);
    color: var(--text); cursor: pointer; text-align: left;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.picked { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .sketch { margin: 2px 0 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .sketch svg { display: block; width: 100%; height: auto; max-width: 340px; color: var(--muted); }
  .fb {
    width: 100%; font: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
    color: var(--text); padding: 8px 10px; resize: vertical; min-height: 36px;
  }
  .fb::placeholder { color: var(--muted); opacity: 0.7; }
  .sendbar { display: flex; gap: 10px; align-items: center; margin-top: 26px; flex-wrap: wrap;
    position: sticky; bottom: 0; background: var(--bg); padding: 14px 0 4px; }
  /* an author display beats the UA sheet's [hidden], so say it here */
  .sendbar[hidden] { display: none; }
  button.send {
    font: inherit; font-size: 14px; font-weight: 700; padding: 9px 16px;
    border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
  }
  button.reset {
    font: inherit; font-size: 12px; padding: 6px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    color: var(--muted); cursor: pointer;
  }
  .sendmsg { font-size: 13px; color: var(--muted); }
  .sendmsg.ok { color: var(--done); font-weight: 700; }
  .sendmsg.err { color: var(--warn); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="intro"></p>
  <div class="bar"><div class="bar-fill" id="barfill"></div></div>
  <p class="progress" id="progress"></p>
  <p class="eyebrow" id="eyebrow"></p>
  <div id="content"></div>
  <div class="navbar">
    <button class="nav" id="back">Back</button>
    <button class="nav next" id="next">Next</button>
    <span class="hint" id="hint"></span>
  </div>
  <div class="sendbar" id="sendbar" hidden>
    <button class="send" id="send">Send</button>
    <button class="reset" id="reset">Clear</button>
    <span class="sendmsg" id="sendmsg"></span>
  </div>
</main>
<script>
  const SPEC = {"title":"Grill: three designs before I build any of them","intro":"You asked to be grilled first on all three. Every question here is one where guessing wrong costs a rebuild, so none of them are polite. Where the honest answer is \"that cannot work\", it says so instead of promising it. Your three other feature requests are at the end for you to rank.","storageKey":"punchlist-grill-2026-07-28","sendLabel":"Send my answers","chatPrefix":"Grill answers:","sections":[{"heading":"1. Formatting, round two","items":[{"id":"fmt-model","title":"The decision the whole feature hangs on: when is a marker visible?","body":"Round one died on one detail. A caret at the visual end of rendered bold sits INSIDE the bold, so the code that maps your caret back to the stored text lost count, and Enter split the line in the wrong place. Pulling bold only hid it; links had it too. Any rebuild has to answer this first, and the three answers are genuinely different products.\n\nRaw-while-editing is how Obsidian and Bear do it, and it removes the bug by construction: the row you are typing in is plain text, so there is no rendered span for a caret to hide inside.","sketch":"<svg viewBox=\"0 0 340 96\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><rect x=\"6\" y=\"8\" width=\"328\" height=\"34\" rx=\"6\"/><text x=\"18\" y=\"30\" font-size=\"13\" fill=\"currentColor\" stroke=\"none\">Ship the **release notes** today</text><text x=\"268\" y=\"30\" font-size=\"10\" fill=\"currentColor\" stroke=\"none\" opacity=\"0.7\">editing</text><rect x=\"6\" y=\"54\" width=\"328\" height=\"34\" rx=\"6\" opacity=\"0.5\"/><text x=\"18\" y=\"76\" font-size=\"13\" fill=\"currentColor\" stroke=\"none\">Ship the </text><text x=\"78\" y=\"76\" font-size=\"13\" font-weight=\"700\" fill=\"currentColor\" stroke=\"none\">release notes</text><text x=\"166\" y=\"76\" font-size=\"13\" fill=\"currentColor\" stroke=\"none\">today</text><text x=\"262\" y=\"76\" font-size=\"10\" fill=\"currentColor\" stroke=\"none\" opacity=\"0.7\">not editing</text></svg>","answers":{"options":["Raw while editing that row, rendered everywhere else","Rendered always, including while typing (what failed last time)","Never rendered: markers stay visible, they only mean something on export","Not sure, argue me through it"]},"placeholder":"If you have seen an app that gets this right, name it."},{"id":"fmt-marks","title":"Which marks do you actually use, honestly?","body":"Every mark added is more caret arithmetic and more ways to break Enter. Pick what you would genuinely use in a task line, not what a text editor usually has.","answers":{"multi":true,"options":["Bold","Italic","Strikethrough","Inline code","Highlight","Nothing beyond bold, keep it tiny"]},"placeholder":""},{"id":"fmt-apply","title":"How do you want to apply it?","body":"Ctrl+B was removed with the rendering because a shortcut that promises bold and delivers asterisks is worse than no shortcut. It can come back, but only if the answer above makes it honest.","answers":{"multi":true,"options":["Ctrl+B and friends","Just typing the markers myself","A small toolbar when text is selected","Markdown autoformat: typing ** closes itself"]},"placeholder":""},{"id":"fmt-literal","title":"What about text that only looks like formatting?","body":"A task like \"buy 2*3*4 timber\" or a path like some_file_name.txt contains marker characters and means nothing by them. Rendering will eat them unless it is told not to.","answers":{"options":["Escape it for me automatically, I never want to think about it","Only render when the markers wrap a whole word, so 2*3*4 is safe","Render it anyway, I will type a backslash when I need to","This has bitten me, see my note"]},"placeholder":""}]},{"heading":"2. Revoking a device","items":[{"id":"rev-threat","title":"First, what are you actually defending against?","body":"This decides whether the feature is worth building at all, so it is the first question rather than a footnote. Forgetting a device already tidies the list. Revoking is a different thing: it is about a device that should no longer be able to read or write your board.","answers":{"options":["A device I no longer control: sold, lost, stolen","A person I shared access with and no longer want to","Neither, I just want the list to be tidy and honest","Nothing concrete, it bothered me that the app could not do it"]},"placeholder":""},{"id":"rev-how","title":"There are only three real ways, and each costs you something","body":"Every device shares ONE token today, which is why forgetting cannot revoke. The three honest options:\n\nROTATE. Make a new token on GitHub, put it in the devices you keep, and every other device is out. Works today, costs you a trip per device you keep.\n\nPER-DEVICE TOKENS. Each device gets its own fine-grained token, so you can kill one. Real revocation, but you create a token on GitHub for every device you ever add, forever.\n\nA REAL LOGIN. Sign in to something instead of pasting a token. Proper revocation, and it means a server or a GitHub App, which breaks the no-server rule the whole app is built on.","answers":{"options":["Rotate, but walk me through it inside the app so I do not have to think","Per-device tokens, I will pay the setup cost for real revocation","A real login, and yes I understand what that changes about the app","Leave it, forgetting plus the guide is enough"]},"placeholder":""},{"id":"rev-copy","title":"The part no design can fix","body":"A device that already synced has a full copy of your board sitting in its browser. Cutting off access stops it reading anything NEW and stops it writing. It does not reach across the internet and delete what it already has. Nothing can, short of that device opening the app again while online.","answers":{"options":["Understood, that is fine, cut off future access and say so plainly","Then I want the app to at least try: wipe on next contact if it is revoked","That changes my mind, this matters less than I thought"]},"placeholder":""}]},{"heading":"3. Reminders and scheduling, the serious one","items":[{"id":"rem-broken","title":"You said it needs to actually work. What fails for you today?","body":"So I fix the thing that is broken rather than the thing that is easiest to build.","answers":{"multi":true,"options":["Reminders never reach me, because the app has to be open","Setting a time is too fiddly","I set them and then never see them again","Scheduling and the timeline do not match how I actually plan a day","Recurring things are not possible"]},"placeholder":"Tell me about the last time it let you down."},{"id":"rem-reach","title":"The hard constraint, stated plainly","body":"A reminder can only reach you if something is running when it fires. Punchlist is one HTML file with no server, so today that something is the open tab, which is why alerts only fire while the board is open.\n\nThe ways out, in order of what they cost:\n\nCALENDAR. Scheduling writes a .ics file your real calendar swallows. Your phone then does the reminding, on the lock screen, offline, forever. Costs: the reminder lives in your calendar, so changing the time in Punchlist means re-exporting.\n\nINSTALL IT. The hosted app becomes installable, and an installed app can wake itself to notify. Costs: only works for the hosted copy, never the file you keep on disk, and browser support for scheduled notifications is thin.\n\nSERVER. Something of mine runs and pushes to you. Costs: the app stops being local-only, which is the thing it is.","answers":{"options":["Calendar. Let the thing that already works do the reminding","Install it. I want the reminder to come from Punchlist itself","Both: calendar for real life, in-app alerts while I am working","Neither is worth it, keep reminders as a while-open nudge and say so honestly"]},"placeholder":""},{"id":"rem-truth","title":"Where does a scheduled task actually live?","body":"This is the question that decides the whole workflow. If your calendar is the truth, Punchlist should push to it and stop pretending to own the time. If Punchlist is the truth, your calendar should be a read-only shadow of it, and moving a task in Punchlist has to move the calendar entry too.","answers":{"options":["Punchlist owns the time, the calendar is a shadow of it","The calendar owns the time, Punchlist just points at it","They are separate on purpose, do not link them"]},"placeholder":""},{"id":"rem-shape","title":"What does a scheduled day look like when it is working?","body":"The timeline view exists and you have never mentioned using it, which usually means it is not the shape you think in.","answers":{"options":["A list of today, in order, no clock times","Real blocks on a clock, like a calendar day","Just a due date, I decide the order in the moment","Something else, see my note"]},"placeholder":"Describe your actual morning: what do you look at first?"}]},{"heading":"4. Your three other requests, ranked by you","items":[{"id":"req-rank","title":"Which of these three first?","body":"All three are boarded in your words. Pick the order rather than letting me guess it.","answers":{"multi":true,"options":["Push a checked item down its group","Colon then type, for emoji","Drawing on images in focus mode","None of these before the three grills above"]},"placeholder":""},{"id":"req-pushdown","title":"Push a checked item down: how far, and what about its children?","body":"\"Down\" has three meanings and they behave very differently once tasks are nested.","answers":{"options":["To the bottom of its group, under everything","Just below its unfinished siblings, keeping its place in the nesting","Only top-level items move, nested ones stay put","Make it a setting, off by default"]},"placeholder":""},{"id":"req-emoji","title":"Colon-emoji: how big a list, given it has to ship inside the file?","body":"No external requests is a product rule, so the emoji list has to live in the HTML file itself. The full Unicode set with searchable names is roughly 200 KB, about half the size of the whole app today. A curated few hundred is a rounding error.","answers":{"options":["A few hundred common ones is plenty","Everything, I will take the file size","Skip the list: let me type :fire: and just convert it"]},"placeholder":""},{"id":"req-drawing","title":"Drawing on images: is the drawing part of the image, or a layer over it?","body":"You said you want to keep editing and deleting lines afterwards, which only works if the strokes are kept separately from the picture. That is the bigger build, and it means an image with drawing on it is no longer a plain image when you export or paste it elsewhere.","answers":{"options":["A layer, always editable, even if export is more work","Baked in, simpler, I accept I cannot undo it later","Layer while I am in the app, baked in when I export"]},"placeholder":"Which do you reach for: arrows and boxes, or freehand?"}]}]};
  const KEY = SPEC.storageKey;
  const store = JSON.parse(localStorage.getItem(KEY) || "{}");
  store.notes = store.notes || {};
  store.picks = store.picks || {};
  store.shots = store.shots || {};

  document.title = "Punchlist — " + SPEC.title;
  document.getElementById("title").textContent = SPEC.title;
  document.getElementById("intro").textContent = SPEC.intro;
  document.getElementById("send").textContent = SPEC.sendLabel;

  // Evren, 2026-07-28: "also at the end nice to ask if I have ideas issue or
  // other things that pop into my mind". It lives here rather than in a spec so
  // that no round can be written without it. A spec that wants its own wording
  // supplies an item with this id and keeps it.
  if (!SPEC.sections.some((s) => s.items.some((i) => i.id === "open-catchall"))) {
    SPEC.sections = [...SPEC.sections, {
      heading: "Before you send",
      items: [{
        id: "open-catchall",
        title: "Anything else on your mind",
        body: "An idea, something that has been annoying you, a bug you never reported, a direction you keep coming back to. Whatever surfaced while you were answering these. It goes on the board in your words, before any code gets written.",
        placeholder: "Type anything. Screenshots welcome, paste them straight in.",
      }],
    }];
  }

  const root = document.getElementById("content");
  const allIds = [];

  // Screenshots are data URLs, and a few of them outweigh everything else on the
  // page. If they push localStorage over quota, keep the answers (the part that
  // is expensive to retype) and let the images live in memory for this visit.
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(store));
    } catch {
      try {
        localStorage.setItem(KEY, JSON.stringify({ ...store, shots: {} }));
      } catch {}
    }
  }
  function hasInput(id) {
    return (store.picks[id] && store.picks[id].length)
      || (store.notes[id] && store.notes[id].trim())
      || (store.shots[id] && store.shots[id].length);
  }

  // Evren, 2026-07-28: "it would be nice if I can easily paste in an image with
  // the feedback I add here. Multiple images would also even be better."
  // Shrunk on the way in: a phone screenshot is several MB, the chat endpoint
  // caps a message at 2.5 MB, and nothing here needs more than screen detail.
  const SHOT_MAX_EDGE = 1600;
  function shrinkToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("could not read that image"));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("that file is not an image"));
        img.onload = () => {
          const scale = Math.min(1, SHOT_MAX_EDGE / Math.max(img.width, img.height));
          if (scale === 1 && reader.result.length < 900_000) return resolve(reader.result);
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/webp", 0.85));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function paintCard(card, id) { card.classList.toggle("noted", Boolean(hasInput(id))); }
  function paintProgress() {
    const n = allIds.filter(hasInput).length;
    document.getElementById("progress").textContent =
      n ? n + " of " + allIds.length + " answered" : "Click the answers that fit and add notes, then send";
    document.getElementById("barfill").style.width =
      Math.round((Math.min(at, steps.length) / Math.max(1, steps.length)) * 100) + "%";
  }

  const steps = [];
  for (const section of SPEC.sections) {
    for (const item of section.items) {
      allIds.push(item.id);
      const card = document.createElement("div");
      card.className = "item";
      card.dataset.id = item.id;

      const h3 = document.createElement("h3");
      h3.textContent = item.title;
      card.appendChild(h3);

      if (item.body) {
        const p = document.createElement("p");
        p.textContent = item.body;
        card.appendChild(p);
      }
      if (item.sketch) {
        const s = document.createElement("div");
        s.className = "sketch";
        s.innerHTML = item.sketch;
        card.appendChild(s);
      }
      if (item.answers && Array.isArray(item.answers.options)) {
        const multi = Boolean(item.answers.multi);
        const wrap = document.createElement("div");
        wrap.className = "answers";
        for (const opt of item.answers.options) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = opt;
          if ((store.picks[item.id] || []).includes(opt)) b.classList.add("picked");
          b.addEventListener("click", () => {
            let cur = store.picks[item.id] || [];
            if (multi) cur = cur.includes(opt) ? cur.filter((x) => x !== opt) : [...cur, opt];
            else cur = cur.includes(opt) ? [] : [opt];
            store.picks[item.id] = cur;
            if (!cur.length) delete store.picks[item.id];
            persist();
            const picked = store.picks[item.id] || [];
            [...wrap.children].forEach((c) => c.classList.toggle("picked", picked.includes(c.textContent)));
            paintCard(card, item.id);
            paintProgress();
          });
          wrap.appendChild(b);
        }
        card.appendChild(wrap);
      }

      const ta = document.createElement("textarea");
      ta.className = "fb";
      ta.dataset.fb = item.id;
      ta.placeholder = item.placeholder || "Add a note (optional). Paste a screenshot straight in.";
      ta.value = store.notes[item.id] || "";
      ta.addEventListener("input", () => {
        if (ta.value.trim()) store.notes[item.id] = ta.value;
        else delete store.notes[item.id];
        persist();
        paintCard(card, item.id);
        paintProgress();
      });
      card.appendChild(ta);

      const strip = document.createElement("div");
      strip.className = "shots";
      card.appendChild(strip);

      function paintShots() {
        strip.replaceChildren();
        for (const [index, src] of (store.shots[item.id] || []).entries()) {
          const fig = document.createElement("span");
          fig.className = "shot";
          const img = document.createElement("img");
          img.src = src;
          img.alt = "Screenshot " + (index + 1);
          const drop = document.createElement("button");
          drop.type = "button";
          drop.className = "shot-drop";
          drop.textContent = "×";
          drop.title = "Remove this image";
          drop.addEventListener("click", () => {
            store.shots[item.id].splice(index, 1);
            if (!store.shots[item.id].length) delete store.shots[item.id];
            persist();
            paintShots();
            paintCard(card, item.id);
            paintProgress();
          });
          fig.append(img, drop);
          strip.appendChild(fig);
        }
      }
      paintShots();

      ta.addEventListener("paste", async (event) => {
        const files = [...(event.clipboardData?.items || [])]
          .filter((entry) => entry.kind === "file" && entry.type.startsWith("image/"))
          .map((entry) => entry.getAsFile())
          .filter(Boolean);
        if (!files.length) return; // ordinary text paste, leave it alone
        event.preventDefault();
        for (const file of files) {
          try {
            const src = await shrinkToDataUrl(file);
            (store.shots[item.id] = store.shots[item.id] || []).push(src);
          } catch {}
        }
        persist();
        paintShots();
        paintCard(card, item.id);
        paintProgress();
      });

      paintCard(card, item.id);
      steps.push({ heading: section.heading, item, card });
    }
  }

  // The last stop is not a question, it is everything he said, in one list, so
  // nothing gets sent that he cannot see first. Any line jumps back to its own
  // question. Where he stopped is remembered, so a reload resumes.
  const backEl = document.getElementById("back");
  const nextEl = document.getElementById("next");
  const hintEl = document.getElementById("hint");
  const eyebrowEl = document.getElementById("eyebrow");
  const sendbarEl = document.getElementById("sendbar");
  let at = Math.min(Math.max(Number(store.at) || 0, 0), steps.length);

  function buildReview() {
    const list = document.createElement("ul");
    list.className = "review";
    steps.forEach((step, index) => {
      const li = document.createElement("li");
      const label = document.createElement("b");
      label.textContent = step.item.title;
      li.appendChild(label);
      const picks = store.picks[step.item.id] || [];
      const note = (store.notes[step.item.id] || "").trim();
      const shots = (store.shots[step.item.id] || []).length;
      const parts = [];
      if (picks.length) parts.push(picks.join(" | "));
      if (note) parts.push(picks.length ? "(" + note + ")" : note);
      if (shots) parts.push("[" + shots + " image" + (shots === 1 ? "" : "s") + "]");
      if (!parts.length) {
        li.classList.add("skipped");
        li.append("Skipped");
      } else {
        li.append(parts.join(" "));
      }
      const jump = document.createElement("button");
      jump.type = "button";
      jump.className = "jump";
      jump.textContent = parts.length ? "Change" : "Answer it";
      jump.addEventListener("click", () => show(index));
      li.appendChild(document.createElement("br"));
      li.appendChild(jump);
      list.appendChild(li);
    });
    return list;
  }

  function show(index) {
    at = Math.min(Math.max(index, 0), steps.length);
    store.at = at;
    persist();
    const onReview = at === steps.length;
    root.replaceChildren(onReview ? buildReview() : steps[at].card);
    eyebrowEl.textContent = onReview ? "Everything you said" : steps[at].heading;
    backEl.disabled = at === 0;
    nextEl.textContent = onReview ? "Back to the last question" : (at === steps.length - 1 ? "Review" : "Next");
    if (onReview) nextEl.classList.remove("next");
    else nextEl.classList.add("next");
    hintEl.textContent = onReview
      ? "Send when it looks right. Anything you skipped is simply left out."
      : "Question " + (at + 1) + " of " + steps.length + ". Skipping is fine.";
    sendbarEl.hidden = !onReview;
    paintProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  backEl.addEventListener("click", () => show(at - 1));
  nextEl.addEventListener("click", () => show(at === steps.length ? at - 1 : at + 1));
  document.addEventListener("keydown", (event) => {
    if (!event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === "ArrowRight") { event.preventDefault(); show(at + 1); }
    if (event.key === "ArrowLeft") { event.preventDefault(); show(at - 1); }
  });
  show(at);

  document.getElementById("reset").addEventListener("click", () => {
    store.notes = {};
    store.picks = {};
    store.shots = {};
    store.at = 0;
    persist();
    location.reload();
  });

  document.getElementById("send").addEventListener("click", async () => {
    const lines = [];
    for (const section of SPEC.sections) {
      for (const item of section.items) {
        if (!hasInput(item.id)) continue;
        const picks = store.picks[item.id] || [];
        const note = (store.notes[item.id] || "").trim();
        const shots = store.shots[item.id] || [];
        let line = "- " + item.title;
        if (picks.length) line += ": " + picks.join(" | ");
        if (note) line += picks.length ? " (note: " + note + ")" : ": " + note;
        if (shots.length) line += " [" + shots.length + " image" + (shots.length === 1 ? "" : "s") + " below]";
        lines.push(line);
      }
    }
    const sendmsg = document.getElementById("sendmsg");
    if (!lines.length) {
      sendmsg.textContent = "Nothing to send yet, click an answer or type a note first.";
      sendmsg.className = "sendmsg err";
      return;
    }
    const text = SPEC.chatPrefix + "\n" + lines.join("\n");
    const post = async (body) => {
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error();
    };
    try {
      await post({ from: "user", text });
      // The chat endpoint carries one image per message, so each screenshot
      // follows as its own line, captioned with the item it belongs to. Sent
      // after the summary so the answers land first and the images read as
      // attachments to them.
      let sentShots = 0;
      for (const section of SPEC.sections) {
        for (const item of section.items) {
          for (const [index, img] of (store.shots[item.id] || []).entries()) {
            const of = (store.shots[item.id] || []).length;
            await post({ from: "user", text: item.title + (of > 1 ? " (" + (index + 1) + " of " + of + ")" : ""), img });
            sentShots += 1;
          }
        }
      }
      sendmsg.textContent = sentShots
        ? "Sent, with " + sentShots + " image" + (sentShots === 1 ? "" : "s") + ". The agent has it."
        : "Sent, the agent has it.";
      sendmsg.className = "sendmsg ok";
    } catch {
      sendmsg.textContent = "Could not reach the agent. Open this at http://localhost:4173" + location.pathname + " and retry.";
      sendmsg.className = "sendmsg err";
    }
  });
</script>
</body>
